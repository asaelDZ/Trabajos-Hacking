<!DOCTYPE html>
<html>
<head>
    <title>Incident List</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f4f6f9;
            padding:30px;
        }

        .container{
            max-width:900px;
            margin:auto;
            background:white;
            padding:25px;
            border-radius:12px;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
        }

        h1{
            color:#1f3b57;
        }

        .btn{
            background:#1f6feb;
            color:white;
            padding:10px 15px;
            text-decoration:none;
            border-radius:6px;
            display:inline-block;
            margin-bottom:20px;
        }

        .card{
            background:#f9fbff;
            border-left:6px solid #1f6feb;
            padding:15px;
            margin-bottom:15px;
            border-radius:8px;
        }

        .link{
            color:#1f6feb;
            text-decoration:none;
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Cyber Incident List</h1>

    <a class="btn" href="{% url 'incidents:create' %}">
        + Create Incident
    </a>

    {% for incident in incidents %}

        <div class="card">

            <h3>{{ incident.title }}</h3>

            <p>
                <strong>Severity:</strong>
                {{ incident.severity }}
            </p>

            <p>
                <strong>Resolved:</strong>
                {{ incident.resolved }}
            </p>

            <a class="link"
               href="{% url 'incidents:detail' incident.pk %}">
               View Detail
            </a>

        </div>

    {% empty %}

        <p>No incidents found.</p>

    {% endfor %}

</div>

</body>
</html>
