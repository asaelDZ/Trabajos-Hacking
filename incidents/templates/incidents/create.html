<!DOCTYPE html>
<html>
<head>
    <title>Create Incident</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 30px; }
        .container { max-width: 700px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #1f3b57; }
        input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; }
        button { background: #1f6feb; color: white; padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; }
        a { color: #1f6feb; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h1>Create Cyber Incident</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Incident</button>
    </form>

    <br>
    <a href="{% url 'incidents:home' %}">Back to list</a>
</div>
</body>
</html>
