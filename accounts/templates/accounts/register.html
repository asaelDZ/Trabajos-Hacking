<!DOCTYPE html>
<html>
<head>
    <title>Register | CyberLab</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f0f1a;
            color: #cdd6f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .box {
            background: #1e1e2e;
            padding: 40px;
            border-radius: 10px;
            width: 380px;
            border: 1px solid #45475a;
        }

        h1 {
            color: #89b4fa;
            text-align: center;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px 0;
            background: #11111b;
            color: #cdd6f4;
            border: 1px solid #45475a;
            border-radius: 4px;
        }

        button {
            background: #89b4fa;
            color: #1e1e2e;
            padding: 10px 24px;
            border: none;
            border-radius: 4px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
        }

        a {
            color: #89b4fa;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>📝 Create Account</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Register</button>
    </form>

    <p>
        Already have an account?
        <a href="{% url 'accounts:login' %}">Login</a>
    </p>
</div>

</body>
</html>
